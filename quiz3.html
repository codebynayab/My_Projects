<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Form </title>
</head>

<body>
    <h1>Create an Account</h1>
    <form method="post">
        <div>
            <label for="name">Enter Your Full Name</label>
            <p>
                <input type="text" name="name" id="name" placeholder="Enter name" required>
            </p>
        </div>
        <div>
            <label for="email">Enter Your Email </label>
            <p>
                <input type="email" name="email" id="email" placeholder="Enter email" required>
            </p>
        </div>
        <div>
            <label for="password">Enter Your Password</label>
            <p>
                <input type="password" name="password" id="password" placeholder="Enter password" required>
            </p>
        </div>
        <div>
            <label for="country">Select Your Country</label>
            <p>
                <select name="country" id="country" required>
                    <option value="">select country</option>
                    <option>Pakistan</option>
                    <option>Saudia Arabia</option>
                    <option>Turkey</option>
                    <option>Canada</option>
                    <option>USA</option>
                    <option>Thailand</option>
                </select>
            </p>
        </div>
        <div>
            <p>Select your hobbies</p>
            <input type="checkbox" name="hobby" id="reading" value="reading">
            <label for="reading">Reading</label>
            <input type="checkbox" name="hobby" id="writing" value="writing">
            <label for="writing">Writing</label>
            <input type="checkbox" name="hobby" id="coding" value="coding">
            <label for="coding">Coding</label>
            <input type="checkbox" name="hobby" id="sports" value="sports">
            <label for="sports">Sports</label>

        </div>
        <div>
            <p>Agreemnet:</p>
            <p> 
                <input type="checkbox" name="terms" id="terms" required>
                <label for="terms">I Agree To The Terms and Conditions</label>
            </p>

        </div>
        <div>
            <button type="submit">Create Account</button>
        </div>
    </form>
</body>

</html>
